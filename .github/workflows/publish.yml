name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check whether this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@pavel-agarkov/skills@${VERSION}" version >/dev/null 2>&1; then
            echo "@pavel-agarkov/skills@${VERSION} is already published; skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@pavel-agarkov/skills@${VERSION} is new; publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure npm >= 11.5.1 for trusted publishing
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install -g npm@latest
          npm -v
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - name: Write release notes
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: node scripts/changelog.js notes "$VERSION" > notes.md
      - name: Create the tag and GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh release create "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA" --title "v$VERSION"
