name: CI

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      # `npm test` rebuilds dist/skills first, so a stale committed bundle shows up as a diff here.
      - name: Committed skill bundles are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          if [ -n "$(git status --porcelain -- dist/skills)" ]; then
            git status --short -- dist/skills
            echo "dist/skills is out of date: run npm run build and commit the result"
            exit 1
          fi

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Compare the version with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:package.json > "$RUNNER_TEMP/base-package.json"
          BASE_VERSION=$(node -p "require(process.argv[1]).version ?? ''" "$RUNNER_TEMP/base-package.json")
          node scripts/release-check.ts "$BASE_VERSION"

  # The single check to require in branch protection.
  ci:
    needs: [test, release-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_CHECK_RESULT: ${{ needs.release-check.result }}
        run: |
          echo "test: $TEST_RESULT, release-check: $RELEASE_CHECK_RESULT"
          if [ "$TEST_RESULT" != "success" ] || [ "$RELEASE_CHECK_RESULT" != "success" ]; then
            exit 1
          fi
